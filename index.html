<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Will You Forgive Me? ❤️</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bright-pink: #ff2a75;
    --hot-pink: #ff006e;
    --neon-pink: #ff5c8a;
    --glass-bg: rgba(255, 255, 255, 0.16);
    --glass-border: rgba(255, 180, 210, 0.4);
}

body{
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Plus Jakarta Sans", sans-serif;
    color: #fff;
    background:
        radial-gradient(circle at 15% 20%, rgba(255, 0, 110, 0.35), transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(255, 42, 117, 0.3), transparent 50%),
        linear-gradient(135deg, #1c0312 0%, #360523 48%, #4a072e 100%);
    perspective: 1400px;
    padding: 12px;
}

body::before{
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        linear-gradient(rgba(255, 100, 160, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 100, 160, 0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse at center, black 40%, transparent 85%);
}

.background{
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.glow{
    position: absolute;
    border-radius: 50%;
    filter: blur(110px);
    opacity: .45;
    will-change: transform;
    animation: glowMove 12s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
}

.glow.one{
    width: clamp(240px, 45vw, 480px);
    height: clamp(240px, 45vw, 480px);
    background: #ff006e;
    top: -120px;
    left: -100px;
}

.glow.two{
    width: clamp(260px, 45vw, 500px);
    height: clamp(260px, 45vw, 500px);
    background: #ff2a75;
    right: -140px;
    bottom: -150px;
    animation-delay: -4s;
}

@keyframes glowMove{
    0%{ transform: translate3d(0,0,0) scale(1); }
    100%{ transform: translate3d(60px, 50px, 0) scale(1.15); }
}

/* Floating Bright Petals */
.petal{
    position: absolute;
    bottom: -30px;
    pointer-events: none;
    opacity: 0;
    border-radius: 15px 0 15px 0;
    background: linear-gradient(135deg, #ff75a0, #ff006e);
    box-shadow: 0 0 12px rgba(255, 0, 110, 0.5);
    will-change: transform, opacity;
    animation: floatPetal linear infinite;
}

@keyframes floatPetal{
    0%{
        transform: translate3d(0, 0, 0) rotate(0deg) scale(0.6);
        opacity: 0;
    }
    15%{ opacity: .85; }
    85%{ opacity: .65; }
    100%{
        transform: translate3d(calc(-80px + 160px * var(--sway)), -115vh, 0) rotate(540deg) scale(1.2);
        opacity: 0;
    }
}

.card-wrapper{
    position: relative;
    width: 100%;
    max-width: 580px;
    min-height: clamp(400px, 70vh, 520px);
    z-index: 2;
    perspective: 1200px;
    transform-origin: center center;
    transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Front Main Card */
.card{
    position: relative;
    width: 100%;
    min-height: clamp(400px, 70vh, 520px);
    padding: clamp(24px, 5vw, 45px) clamp(16px, 4vw, 35px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    border: 2px solid var(--glass-border);
    border-radius: clamp(20px, 5vw, 36px);
    background: var(--glass-bg);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.5),
        inset 0 1px 2px rgba(255, 255, 255, 0.5),
        0 0 35px rgba(255, 42, 117, 0.25);
    z-index: 5;
    transition: opacity 0.3s ease;
}

.door{
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
    background: rgba(255, 255, 255, 0.22);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border: 2px solid var(--glass-border);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    z-index: 6;
    pointer-events: none;
    opacity: 0;
    transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.4s ease;
}

.door-left{
    left: 0;
    border-top-left-radius: clamp(20px, 5vw, 36px);
    border-bottom-left-radius: clamp(20px, 5vw, 36px);
    transform-origin: left center;
}

.door-right{
    right: 0;
    border-top-right-radius: clamp(20px, 5vw, 36px);
    border-bottom-right-radius: clamp(20px, 5vw, 36px);
    transform-origin: right center;
}

/* Window Opening State */
.card-wrapper.open .card{
    opacity: 0;
    pointer-events: none;
}

.card-wrapper.open .door{
    opacity: 1;
}

.card-wrapper.open .door-left{
    transform: rotateY(-115deg);
}

.card-wrapper.open .door-right{
    transform: rotateY(115deg);
}

.mood{
    width: clamp(80px, 18vw, 115px);
    height: clamp(80px, 18vw, 115px);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: clamp(12px, 3vh, 20px);
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.14);
    border: 2px solid rgba(255, 180, 210, 0.4);
    box-shadow:
        0 15px 35px rgba(0, 0, 0, 0.3),
        0 0 20px rgba(255, 42, 117, 0.25),
        inset 0 1px 2px rgba(255, 255, 255, 0.4);
}

.mood span{
    font-size: clamp(42px, 10vw, 68px);
    line-height: 1;
    filter: drop-shadow(0 8px 18px rgba(255, 0, 110, 0.4));
    animation: breath 3s ease-in-out infinite;
    display: inline-block;
}

@keyframes breath{
    0%, 100%{ transform: scale(1); }
    50%{ transform: scale(1.06); }
}

.mood.crying span{
    animation: cry 0.5s ease-in-out infinite alternate;
}

@keyframes cry{
    from{ transform: translate3d(0, 0, 0) rotate(-4deg); }
    to{ transform: translate3d(0, -4px, 0) rotate(4deg); }
}

/* Typography */
h1{
    font-family: "Playfair Display", serif;
    font-size: clamp(24px, 5.5vw, 42px);
    line-height: 1.25;
    letter-spacing: -0.5px;
    margin-bottom: clamp(8px, 2vh, 12px);
    font-weight: 800;
    background: linear-gradient(135deg, #ffffff 20%, #ff85a1 60%, #ff2a75 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 3px 10px rgba(255, 0, 110, 0.25));
}

.subtitle{
    max-width: 440px;
    color: rgba(255, 235, 242, 0.95);
    font-size: clamp(13px, 3.2vw, 16px);
    line-height: 1.5;
    margin-bottom: clamp(18px, 3.5vh, 28px);
    font-weight: 600;
}

.buttons{
    position: relative;
    width: 100%;
    height: 100px;
    display: flex;
    justify-content: center;
    align-items: center;
}

button{
    border: 0;
    outline: 0;
    font-family: "Plus Jakarta Sans", sans-serif;
    font-size: clamp(13px, 3.2vw, 16px);
    font-weight: 800;
    padding: clamp(10px, 2.5vw, 14px) clamp(18px, 4vw, 28px);
    border-radius: 100px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    will-change: transform;
    white-space: nowrap;
}

#yesBtn{
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate3d(-112%, -50%, 0);
    background: linear-gradient(135deg, #ff4081, #ff006e);
    color: #ffffff;
    border: 2px solid rgba(255, 255, 255, 0.8);
    text-shadow: 0 2px 4px rgba(80, 0, 30, 0.6);
    box-shadow:
        0 8px 24px rgba(255, 0, 110, 0.45),
        inset 0 1px 2px rgba(255, 255, 255, 0.8);
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease;
}

#yesBtn:hover{
    transform: translate3d(-112%, -55%, 0) scale(1.05);
    box-shadow: 0 14px 32px rgba(255, 0, 110, 0.65);
}

#noBtn{
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate3d(12%, -50%, 0);
    background: linear-gradient(135deg, #ff2a75, #b50043);
    color: #ffffff;
    text-shadow: 0 2px 4px rgba(60, 0, 20, 0.6);
    box-shadow:
        0 8px 22px rgba(255, 0, 110, 0.35),
        inset 0 1px 1px rgba(255, 255, 255, 0.5);
    transition: transform 0.38s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.hint{
    position: absolute;
    bottom: clamp(10px, 2vh, 15px);
    font-size: clamp(9px, 2.5vw, 12px);
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255, 200, 220, 0.7);
    font-weight: 700;
}

.inner-card{
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: clamp(20px, 4vw, 36px) clamp(12px, 3vw, 24px);
    border-radius: clamp(20px, 5vw, 36px);
    background: rgba(255, 255, 255, 0.98);
    box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.55),
        0 0 50px rgba(255, 0, 110, 0.35);
    opacity: 0;
    transform: scale(0.85) translate3d(0, 20px, 0);
    transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s, opacity 0.6s ease 0.4s;
    z-index: 1;
}

.card-wrapper.open .inner-card{
    opacity: 1;
    transform: scale(1) translate3d(0, 0, 0);
}

.popup-mood{
    font-size: clamp(45px, 10vw, 68px);
    margin-bottom: clamp(6px, 1.5vh, 12px);
    animation: popupHappy 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.6s both;
}

@keyframes popupHappy{
    0%{ transform: scale(0.5) rotate(-15deg); }
    60%{ transform: scale(1.1) rotate(5deg); }
    100%{ transform: scale(1) rotate(0); }
}

.inner-card h2{
    font-family: "Playfair Display", serif;
    font-size: clamp(18px, 4.2vw, 28px);
    margin-bottom: clamp(10px, 2vh, 16px);
    color: #ff006e;
    font-weight: 800;
    line-height: 1.35;
    text-align: center;
}

.inner-card h2 span{
    display: block;
}

.inner-card p{
    color: #333;
    font-size: clamp(12px, 2.9vw, 15px);
    line-height: 1.45;
    font-weight: 600;
    max-width: 400px;
    margin-bottom: clamp(14px, 2.5vh, 22px);
    text-align: center;
}

.popup-badge{
    display: inline-block;
    padding: clamp(7px, 1.8vw, 10px) clamp(16px, 3.5vw, 24px);
    font-size: clamp(11px, 2.8vw, 14px);
    font-weight: 800;
    color: #fff;
    border-radius: 100px;
    background: linear-gradient(135deg, #ff006e, #ff2a75);
    box-shadow: 0 8px 20px rgba(255, 0, 110, 0.38);
}

.confetti{
    position: fixed;
    top: -20px;
    z-index: 50;
    width: 10px;
    height: 14px;
    pointer-events: none;
    border-radius: 3px;
    will-change: transform, opacity;
    animation: confettiFall linear forwards;
}

@keyframes confettiFall{
    to{
        transform: translate3d(
            calc(-100px + 200px * var(--random)),
            105vh,
            0
        ) rotate(720deg);
        opacity: 0;
    }
}

@media(max-width: 600px){
    body{
        perspective: 800px;
        padding: 8px;
    }

    /* Scaling down card-wrapper when opened so door swing fits mobile screens perfectly */
    .card-wrapper{
        max-width: 88vw;
        min-height: clamp(380px, 62vh, 460px);
    }

    .card{
        min-height: clamp(380px, 62vh, 460px);
        padding: 24px 14px;
    }

    .card-wrapper.open{
        transform: scale(0.76);
    }

    .card-wrapper.open .door-left{
        transform: rotateY(-90deg);
    }

    .card-wrapper.open .door-right{
        transform: rotateY(90deg);
    }

    .buttons{
        height: 100px;
    }

    #yesBtn{
        left: 50%;
        top: 18%;
        transform: translate3d(-50%, 0, 0);
        width: 88%;
        padding: 12px 16px;
    }

    #yesBtn:hover{
        transform: translate3d(-50%, -2px, 0) scale(1.02);
    }

    #noBtn{
        left: 50%;
        top: 62%;
        transform: translate3d(-50%, 0, 0);
        width: 88%;
        padding: 12px 16px;
    }
}

@media(max-width: 360px){
    .card-wrapper.open{
        transform: scale(0.68);
    }
}
</style>
</head>

<body>

<div class="background" id="petalContainer">
    <div class="glow one"></div>
    <div class="glow two"></div>
</div>

<div class="card-wrapper" id="cardWrapper">

    <!-- Revealed Content inside Window -->
    <div class="inner-card">
        <div class="popup-mood">🥰</div>
        <h2>
            <span>Thank you</span>
            <span>My dear would be wife</span>
            <span>My Muku! ❤️</span>
        </h2>
        <p>Thank you for setting me free and forgiving me. You just made my day! 🥹✨</p>
        <div class="popup-badge">Forever Yours ❤️</div>
    </div>

    <!-- Window Shutters/Doors -->
    <div class="door door-left"></div>
    <div class="door door-right"></div>

    <!-- Main Front Card -->
    <div class="card" id="cardContainer">
        <div class="mood" id="mood">
            <span id="moodEmoji">🥺</span>
        </div>

        <h1>Will You Forgive Me?</h1>

        <p class="subtitle">
            I know I messed up... but I'm hoping you can find it in your heart to forgive me. ❤️
        </p>

        <div class="buttons">
            <button id="yesBtn">Yes, I Forgive You ❤️</button>
            <button id="noBtn">No 😢</button>
        </div>

        <div class="hint">Choose wisely ✨</div>
    </div>

</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const mood = document.getElementById("mood");
const moodEmoji = document.getElementById("moodEmoji");
const cardContainer = document.getElementById("cardContainer");
const cardWrapper = document.getElementById("cardWrapper");

let escapeCount = 0;

function cryingFace(){
    mood.classList.remove("happy");
    mood.classList.add("crying");
    moodEmoji.textContent = "😭";
}

function normalFace(){
    mood.classList.remove("crying");
    moodEmoji.textContent = "🥺";
}

/* Calculates evasive positions for the NO button staying inside the card bounds */
function moveNo(){
    cryingFace();
    escapeCount++;

    const cardRect = cardContainer.getBoundingClientRect();
    const btnRect = noBtn.getBoundingClientRect();

    const padding = 12;
    const minX = -cardRect.width / 2 + btnRect.width / 2 + padding;
    const maxX = cardRect.width / 2 - btnRect.width / 2 - padding;
    const minY = -cardRect.height / 2 + btnRect.height / 2 + padding;
    const maxY = cardRect.height / 2 - btnRect.height / 2 - padding;

    const randomX = Math.floor(Math.random() * (maxX - minX + 1)) + minX;
    const randomY = Math.floor(Math.random() * (maxY - minY + 1)) + minY;
    
    const randomRotate = (Math.random() - 0.5) * 16;

    noBtn.style.transform = `translate3d(${randomX}px, ${randomY}px, 0) rotate(${randomRotate}deg)`;

    const texts = [
        "No 😢",
        "Are You Sure? 🥺",
        "Really? 😭",
        "Please? 🥹",
        "Think Again 💔",
        "Don't Do This 😭",
        "Last Chance 🥺"
    ];

    noBtn.textContent = texts[Math.min(escapeCount, texts.length - 1)];
}

noBtn.addEventListener("mouseenter", moveNo);
noBtn.addEventListener("touchstart", e => {
    e.preventDefault();
    moveNo();
}, {passive: false});

noBtn.addEventListener("mouseleave", () => {
    setTimeout(() => {
        if(!cardWrapper.classList.contains("open")){
            normalFace();
        }
    }, 400);
});

yesBtn.addEventListener("mouseenter", () => {
    mood.classList.remove("crying");
    mood.classList.add("happy");
    moodEmoji.textContent = "😊";
});

yesBtn.addEventListener("mouseleave", () => {
    if(!cardWrapper.classList.contains("open")){
        normalFace();
    }
});

/* Trigger Window Opening on YES Click */
yesBtn.addEventListener("click", () => {
    cardWrapper.classList.add("open");
    createConfetti();
});

/* Creates confetti celebration particles */
function createConfetti(){
    const colors = ["#ff006e", "#ff2a75", "#ff75a0", "#00f5d4", "#ffb703"];
    for(let i = 0; i < 90; i++){
        const c = document.createElement("div");

        c.className = "confetti";
        c.style.left = Math.random() * 100 + "vw";
        c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        c.style.animationDuration = (2.2 + Math.random() * 2.2) + "s";
        c.style.animationDelay = Math.random() * 0.3 + "s";
        c.style.setProperty("--random", Math.random());

        document.body.appendChild(c);

        setTimeout(() => c.remove(), 5000);
    }
}

function createPetals(){
    const bg = document.getElementById("petalContainer");

    for(let i = 0; i < 18; i++){
        const petal = document.createElement("div");
        const size = (12 + Math.random() * 14);

        petal.className = "petal";
        petal.style.left = Math.random() * 100 + "%";
        petal.style.width = size + "px";
        petal.style.height = (size * 1.3) + "px";
        petal.style.animationDuration = (7 + Math.random() * 7) + "s";
        petal.style.animationDelay = Math.random() * 8 + "s";
        petal.style.setProperty("--sway", Math.random());

        bg.appendChild(petal);
    }
}

createPetals();
</script>

</body>
</html>
